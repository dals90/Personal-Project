<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackSmart - Tu Maleta Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .item-checked { text-decoration: line-through; opacity: 0.5; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-6xl mx-auto md:py-10">
        <div class="bg-white md:rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[90vh]">
            
            <aside class="w-full md:w-1/3 bg-blue-600 p-8 text-white">
                <div class="mb-10 text-center md:text-left">
                    <h1 class="text-4xl font-extrabold tracking-tight">PackSmart ✈️</h1>
                    <p class="text-blue-100 mt-2">Equipaje inteligente basado en el clima real.</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2">¿A dónde vas?</label>
                        <input id="ciudad" type="text" placeholder="Ej: San José, CR" 
                               class="w-full p-3 rounded-xl text-gray-900 border-none focus:ring-4 focus:ring-blue-300 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">Tipo de Actividad</label>
                        <select id="actividad" class="w-full p-3 rounded-xl text-gray-900 border-none outline-none">
                            <option value="senderismo">🥾 Senderismo / Montaña</option>
                            <option value="playa">🏖️ Playa / Relax</option>
                            <option value="urbano">🏙️ Ciudad / Turismo</option>
                        </select>
                    </div>

                    <button onclick="generarLista()" 
                            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95">
                        Generar Mi Lista
                    </button>
                </div>
            </aside>

            <main class="w-full md:w-2/3 p-8 bg-white">
                <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-400 space-y-4">
                    <svg class="w-20 h-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <p class="text-lg">Ingresa tu destino para calcular tu equipaje</p>
                </div>

                <div id="seccionLista" class="hidden fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b pb-6">
                        <div>
                            <h2 class="text-2xl font-extrabold text-gray-800">Tu Equipaje <span id="nombreCiudad" class="text-blue-600"></span></h2>
                            <p id="climaDesc" class="text-gray-500 capitalize italic"></p>
                        </div>
                        <span id="climaInfo" class="px-4 py-2 bg-orange-100 text-orange-700 rounded-full font-bold text-sm shadow-sm border border-orange-200"></span>
                    </div>
                    
                    <ul id="contenedorItems" class="grid grid-cols-1 md:grid-cols-2 gap-3"></ul>

                    <div class="mt-12 p-6 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Recomendaciones Pro</h3>
                        <div class="flex items-center space-x-4">
                            <div class="bg-white p-4 rounded-2xl shadow-md text-2xl">🛒</div>
                            <div>
                                <p class="text-sm text-gray-700">¿Necesitas renovar tu equipo?</p>
                                <a href="TU_LINK_AFILIADO" target="_blank" class="text-blue-600 font-bold hover:underline inline-flex items-center mt-1">
                                    Ver ofertas en Amazon 
                                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js?v=2.0.0"></script>
</body>
</html>
